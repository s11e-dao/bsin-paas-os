# 描述 Compose 文件的版本信息
#version: '2.0'
version: '3'
networks:
  compose-network:
    driver: bridge
    ipam: #自定义IPAM配置
      config:
        - subnet: 172.28.0.0/16
  rocketmq:
    driver: bridge

# 定义服务
services:
  bsin-nacos-standalone-3.0:
    container_name: bsin-nacos-standalone-3.0
#    image: nacos/nacos-server:${BSIN_NACOS_VERSION}
    image: nacos/nacos-server:v3.0.1
    env_file:
      - ./middleware/nacos/.env
#    environment:
#      - PREFER_HOST_MODE=hostname
#      - MODE=${BSIN_NACOS_MODE}
#      - SPRING_DATASOURCE_PLATFORM=mysql
#      - MYSQL_SERVICE_HOST=mysql
#      - MYSQL_SERVICE_DB_NAME=bsin-nacos-config
#      - MYSQL_SERVICE_PORT=3306
#      - MYSQL_SERVICE_USER=${NACOS_MYSQL_DB_USERNAME}
#      - MYSQL_SERVICE_PASSWORD=${NACOS_MYSQL_DB_PASSWORD}
#      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
#      - NACOS_AUTH_IDENTITY_KEY=${BSIN_NACOS_USERNAME}
#      - NACOS_AUTH_IDENTITY_VALUE=${BSIN_NACOS_PASSWORD}
#      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    volumes:
      - ./middleware/nacos/logs/:/home/nacos/logs
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
#    restart: always
#    depends_on:
#      bsin-mysql-3.0:
#        condition: service_healthy
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.2

  bsin-mysql-3.0:
    container_name: bsin-mysql-3.0
    image: bsin-mysql:3.0.0
    build:
      context: middleware/mysql
    ports:
      - "3306:3306"
    privileged: true
    volumes:
      - ./middleware/mysql/conf:/etc/mysql/conf.d
      - ./middleware/mysql/logs:/logs
      - ./middleware/mysql/data:/var/lib/mysql
      - ./middleware/mysql/db:/docker-entrypoint-initdb.d/
      - ./middleware/mysql/db/sqls:/docker-entrypoint-initdb.d/sqls
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--sql-mode=NO_ENGINE_SUBSTITUTION'
    ]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456" ]
      timeout: 30s
      retries: 10
      start_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_MULTIPLE_DATABASES: bsin-nacos-config,bsin-shenyu-gateway,bsin-upms,bsin-crm,bsin-ai,bsin-waas,bsin-oms,bsin-community,bsin-brms,bsin-iot,bsin-damp,bsin-flowable,bsin-workflow,bsin-workflow-admin,bsin-orchestration,bsin-gateway,bsin-intelligent-decision,bsin-seata,bsin-mpc,bsin-mpc-client1,bsin-mpc-client2,bsin-mpc-client3,bsin-mpc-client4,agentscope-schema
      MYSQL_INITDB_SKIP_TZINFO: 1
      MYSQL_ROOT_HOST: '%'
    networks:
     compose-network: #指定network
       ipv4_address: 172.28.0.3

  bsin-redis-3.0:
    container_name: bsin-redis-3.0
    image: bsin-redis:3.0.0
    build:
      context: middleware/redis
      dockerfile: dockerfile
    ports:
      - "6379:6379"
#    restart: always
    privileged: true                                              # 获取宿主机root权限
    volumes:
      - ./middleware/redis/conf/redis.conf:/etc/redis/redis.conf # 映射配置文件目录，宿主机:容器
      - ./middleware/redis/data:/data                           # 映射数据目录，宿主机:容器
    command: [ "redis-server","/etc/redis/redis.conf" ]           # 指定配置文件启动redis-server进程
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.4


  bsin-seata-3.0:
    container_name: bsin-seata-3.0
    image: bsin-seata:3.0.0
    build:
      context: middleware/seata-2.5/seata-server
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=db
      - STORE_DB_DATASOURCE=druid
      - STORE_DB_DB_TYPE=mysql
      - STORE_DB_DRIVER_CLASS_NAME=com.mysql.jdbc.Driver
      - STORE_DB_URL=jdbc:mysql://bsin-mysql-3.0:3306/bsin-seata?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - STORE_DB_USER=root
      - STORE_DB_PASSWORD=123456
      - SEATA_CONFIG_NAME=application.yml
      - SEATA_REGISTRY_TYPE=nacos
      - SEATA_REGISTRY_NACOS_APPLICATION=seata-server
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=bsin-nacos-standalone-3.0:8848
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_NAMESPACE=
      - SEATA_REGISTRY_NACOS_USERNAME=nacos
      - SEATA_REGISTRY_NACOS_PASSWORD=nacos
    volumes:
      - ./middleware/seata-2.5/seata-server/logs:/seata-server/logs
      - ./middleware/seata-2.5/seata-server/conf:/seata-server/conf
    depends_on:
      - bsin-mysql-3.0
        # condition: service_healthy
      - bsin-nacos-standalone-3.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      compose-network:
        ipv4_address: 172.28.0.5

  bsin-rocketmq-namesrv-3.0:
    image: apache/rocketmq:5.3.2
    container_name: bsin-rocketmq-namesrv-3.0
    user: "${UID}:${GID}"
    restart: always
    env_file:
      - ./.env
    environment:
      - NAMESRV_ADDR=bsin-rocketmq-namesrv-3.0:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    ports:
      - 9876:9876   # 映射 namesrv 端口，外部可通过 9876 访问 
    command: sh mqnamesrv
    healthcheck:
      test: [ "CMD", "sh", "-c", "ps aux | grep mqnamesrv | grep -v grep || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rocketmq

  bsin-rocketmq-broker-3.0:
    image: apache/rocketmq:5.3.2
    container_name: bsin-rocketmq-broker-3.0
    user: "${UID}:${GID}"
    restart: always
    environment:
      - NAMESRV_ADDR=bsin-rocketmq-namesrv-3.0:9876
      - HEAP_OPTS=-Xms256M -Xmx512M -Xmn256M -XX:MaxDirectMemorySize=128M
    ports:
      - 10909:10909   # Broker 高速通信端口
      - 10911:10911   # Broker 主端口，客户端/其他 broker 访问
      - 10912:10912   # Broker HA 同步端口
    volumes:
      - ./middleware/rocketmq/store:/home/rocketmq/store
    depends_on:
      - bsin-rocketmq-namesrv-3.0
    command: sh mqbroker
    healthcheck:
      test: [ "CMD", "sh", "-c", "ps aux | grep mqbroker | grep -v grep || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rocketmq

  # RocketMQ Proxy - 使用简化配置
  bsin-rocketmq-proxy-3.0:
    image: apache/rocketmq:5.3.2
    container_name: bsin-rocketmq-proxy-3.0
    user: "${UID}:${GID}"
    restart: always
    env_file:
      - ./.env
    volumes:
      - ./middleware/rocketmq/conf:/home/rocketmq/conf
    environment:
      - NAMESRV_ADDR=bsin-rocketmq-namesrv-3.0:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    networks:
      - rocketmq
    depends_on:
      - bsin-rocketmq-broker-3.0
      - bsin-rocketmq-namesrv-3.0
    ports:
      - 18080:18080
      - 18081:18081
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json

  # $ docker run -d --name rocketmq-dashboard -e "JAVA_OPTS=-Drocketmq.namesrv.addr=127.0.0.1:9876" -p 8080:8080 -t apacherocketmq/rocketmq-dashboard:latest
  bsin-rocketmq-dashboard-3.0:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: bsin-rocketmq-dashboard-3.0
    # restart: always
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=bsin-rocketmq-namesrv-3.0:9876
    ports:
      - 8082:8082
    depends_on:
      - bsin-rocketmq-namesrv-3.0
      - bsin-rocketmq-broker-3.0
    networks:
      compose-network:
        ipv4_address: 172.28.0.9

  bsin-rocketmq-init-topic-3.0:
    image: apache/rocketmq:5.3.2
    container_name: bsin-rocketmq-init-topic-3.0
    # restart: always
    env_file:
      - ./.env
    restart: "no"
    depends_on:
      bsin-rocketmq-namesrv-3.0:
        condition: service_healthy
      bsin-rocketmq-broker-3.0:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for RocketMQ to be ready...' &&
        sleep 60 &&
        until sh mqadmin clusterList -n rmq_namesrv:9876; do
          echo 'Waiting for RocketMQ to be fully ready...' &&
          sleep 10
        done &&
        echo 'Creating topic...' &&
        sh mqadmin updateTopic -n rmq_namesrv:9876 -t topic_saa_studio_document_index -c DefaultCluster -a +message.type=NORMAL &&
        sh mqadmin updateSubGroup -n rmq_namesrv:9876 -g group_saa_studio_document_index -c DefaultCluster &&
        echo 'Verifying topic creation...' &&
        sh mqadmin topicList -n rmq_namesrv:9876 &&
        echo 'Topic creation completed'"
    networks: 
      compose-network:
        ipv4_address: 172.28.0.10


  bsin-elasticsearch-3.0:
    container_name: bsin-elasticsearch-3.0
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    # restart: unless-stopped
    restart: always
    # user: "1000:1000"
    environment:
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - "TZ=Asia/Shanghai"
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "http.cors.enabled=true"
      - "http.cors.allow-origin=\"*\""
      - "http.cors.allow-credentials=false"
      - "http.cors.allow-methods=OPTIONS,HEAD,GET,POST,PUT,DELETE"
      - "http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization"
      - "action.auto_create_index=true"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      # - ./middleware/elasticsearch/conf:/usr/share/elasticsearch/config
      - ./middleware/elasticsearch/data:/usr/share/elasticsearch/data
      - ./middleware/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      # - ./middleware/elasticsearch/conf/kibana.yml:/usr/share/kibana/config/kibana.yml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.11

  bsin-elasticsearch-3.0-kibana:
    container_name: bsin-elasticsearch-3.0-kibana
    image: docker.elastic.co/kibana/kibana:8.17.2
    # restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://bsin-elasticsearch-3.0:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=changeme
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - JAVA_OPTS=-Xms64M -Xmx256M
    ports:
      - "5601:5601"
    depends_on:
      - bsin-elasticsearch-3.0
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:5601" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.12

  bsin-elasticsearch-3.0-head:
    container_name: bsin-elasticsearch-3.0-head
    image: mobz/elasticsearch-head:5
    # restart: unless-stopped
    user: "1000:1000"
    environment:
      - "TZ=Asia/Shanghai"
    ports:
      - "9100:9100"
    depends_on:
      - bsin-elasticsearch-3.0
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.13

  # bsin-emqx默认初始账号和密码
  # username：admin
  # password：public
  bsin-emqx-3.0:
    container_name: bsin-emqx-3.0
    image: bsin-emqx:3.0.0
    build:
      context: middleware/emqx
      dockerfile: dockerfile
    ports:
      - 1883:1883   # MQTT TCP
      - 8883:8883   # MQTT TCP SSL
      - 8083:8083   # MQTT Web Socket
      - 8084:8084   # MQTT Web Socket SSL
      - 18083:18083 # EMQX Dashboard
    volumes:
      - ./middleware/emqx/temp:/opt/emqx/temp
      - ./middleware/emqx/data:/opt/emqx/data   # 数据目录映射，用于持久化数据
      #        - ./middleware/emqx/etc:/opt/emqx/etc
      - ./middleware/emqx/log:/opt/emqx/log     # 日志目录映射，用于持久化日志
      - /etc/localtime:/etc/localtime:ro
#    restart: always
    environment:
      EMQX_NAME: bsin-emqx
      EMQX_HOST: 127.0.0.1
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5
    networks:
      compose-network: #指定network
        ipv4_address: 172.28.0.14

