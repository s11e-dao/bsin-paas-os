brokerClusterName = DefaultCluster         # Broker 所属集群名称，集群部署时需一致
brokerName = broker-a                     # Broker 名称，同一集群下可有多个 brokerName
brokerId = 0                              # Broker ID，0 表示 Master，大于 0 表示 Slave
deleteWhen = 04                           # 每天凌晨 4 点删除过期文件
fileReservedTime = 48                     # 文件保留时间（小时）
brokerRole = ASYNC_MASTER                 # Broker 角色：ASYNC_MASTER（异步主），SYNC_MASTER（同步主），SLAVE（从）
flushDiskType = ASYNC_FLUSH               # 刷盘方式：ASYNC_FLUSH（异步），SYNC_FLUSH（同步）
# IP设置为主机IP，建议不要用127.0.0.1，容器环境下可不配置，让RocketMQ自动识别
# brokerIP1=127.0.0.1
autoCreateTopicEnable=true                # 是否允许自动创建Topic
autoCreateSubscriptionGroup=true          # 是否允许自动创建订阅组
waitTimeMillsInSendQueue=1000             # 发送队列等待时间（毫秒）
# 设置namesrv地址，建议不做修改，使用docker-compose服务名
namesrvAddr=bsin-rocketmq-namesrv-3.0:9876
traceTopicEnable=true                     # 是否开启消息轨迹功能
# 添加必要的配置参数
# brokerIP1=bsin-rocketmq-broker-3.0        # 在容器环境中让RocketMQ自动识别IP
listenPort=10911                          # Broker 监听端口
storePathRootDir=/home/rocketmq/store     # 存储根目录
storePathCommitLog=/home/rocketmq/store/commitlog  # CommitLog 存储路径
storePathConsumeQueue=/home/rocketmq/store/consumequeue  # ConsumeQueue 存储路径
storePathIndex=/home/rocketmq/store/index  # Index 存储路径
storeCheckpoint=/home/rocketmq/store/checkpoint  # Checkpoint 存储路径
abortFile=/home/rocketmq/store/abort       # Abort 文件路径